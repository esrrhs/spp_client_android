name: Record Demo Video

# 手动触发：在 KVM 模拟器内驱动 App 录制 Google Play 审核演示视频，
# 产物 demo.mp4 作为 workflow artifact 上传。
on:
  workflow_dispatch:

jobs:
  record:
    name: Boot emulator, drive UI and screenrecord
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' | sort | tail -1)
          fi
          yes | "$SM" --licenses >/dev/null || true
          NDK_PKG=$("$SM" --list 2>/dev/null | awk '/^[[:space:]]*ndk;/{print $1}' | sort -V | tail -1)
          "$SM" --install "$NDK_PKG"

      - name: Build native libraries
        env:
          SPP_ABIS: x86_64
          HEV_ABIS: x86_64
        run: bash scripts/build_native.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build SPP server
        run: go build -o "$RUNNER_TEMP/spp-server" ./third_party/spp

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record demo video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eux
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb shell input keyevent 82 || true
            # 宿主 SPP server（与配置中的 10.0.2.2:19003 对应）
            "$RUNNER_TEMP/spp-server" -type server -proto tcp -listen :19003 -key testkey -nolog 1 &
            SPP_PID=$!
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            python3 -u scripts/record_demo.py
            kill $SPP_PID || true

      - name: Upload demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: demo.mp4
          if-no-files-found: error
          retention-days: 30
